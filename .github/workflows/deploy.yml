name: Build Vue
on: [push]
jobs:
  create-envfile:
    runs-on: ubuntu-latest
    steps:
      - name: Make envfile
        uses: SpicyPizza/create-envfile@v1
        with:
          envkey_VITE_FLAGSMITH_API_KEY: ${{ secrets.VITE_FLAGSMITH_API_KEY}}
          file_name: .env
  build_vue:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    name: Build Vue
    steps:
      - name: Build
      - uses: actions/checkout@v2
      - id: Build-Vue
        uses: xRealNeon/VuePagesAction@1.0.1
        with:
          username: 'ViktorSeniukov'
          reponame: 'serious-office'
          token: ${{ secrets.GITHUB_TOKEN }} # Leave this line unchanged
          cname: 'sharpoffice.io'
