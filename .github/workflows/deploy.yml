name: Build Vue
on: [push]
jobs:
  build_vue:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    name: Build Vue
    steps:
      - uses: actions/checkout@v2
      - id: Build-Vue
        uses: xRealNeon/VuePagesAction@1.0.1
        env:
          VITE_FLAGSMITH_API_KEY: ${{ secrets.VITE_FLAGSMITH_API_KEY}}
        with:
          username: 'ViktorSeniukov'
          reponame: 'serious-office'
          token: ${{ secrets.GITHUB_TOKEN }} # Leave this line unchanged
          cname: 'sharpoffice.io'
